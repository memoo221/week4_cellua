[project]
name = "coding-assistant"
version = "0.1.0"
description = "AI coding assistant: app/api -> core -> services layered architecture."
requires-python = ">=3.11"
dependencies = [
    "requests>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "api*", "core*", "services*", "ingestion*", "config*"]
